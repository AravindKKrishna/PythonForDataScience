<!DOCTYPE html>
<html>
<head>
    <title>Dry Bean Classification</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4f8cff, #6ad4dd);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
            font-size: 26px;
            letter-spacing: 1px;
        }

        label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-top: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #aaaaaa;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4f8cff;
            box-shadow: 0 0 5px rgba(79, 140, 255, 0.4);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #377dff;
            border: none;
            color: white;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #2d6de0;
        }

        .prediction-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            animation: fadeIn 0.4s ease-in-out;
        }

        .bean-box {
            background: linear-gradient(135deg, #24c6dc, #514a9d);
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Dry Bean Classifier</h2>

    <form action="/predict" method="POST">

        {% for col in feature_names %}
            <label>{{ col }}</label>
            <input type="text" name="{{ col }}" required>
        {% endfor %}

        <button type="submit">Predict Bean Type</button>
    </form>

    {% if prediction_text %}
        <div class="prediction-box bean-box">
            {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
